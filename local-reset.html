<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>LubaNote – vyčištění zařízení</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #071f2a;
      color: #f5fbff;
    }
    .card {
      width: min(100%, 420px);
      padding: 28px;
      border: 1px solid rgba(108, 221, 238, .25);
      border-radius: 24px;
      background: #0d3140;
      box-shadow: 0 18px 60px rgba(0,0,0,.3);
      text-align: center;
    }
    h1 { margin: 0 0 14px; font-size: 1.6rem; }
    p { margin: 0; line-height: 1.5; color: #cce2eb; }
    .spinner {
      width: 42px;
      height: 42px;
      margin: 22px auto;
      border: 4px solid rgba(255,255,255,.18);
      border-top-color: #38d7e8;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    .error { color: #ff9aa3; }
    button {
      width: 100%;
      min-height: 50px;
      margin-top: 20px;
      border: 0;
      border-radius: 14px;
      font: inherit;
      font-weight: 700;
      background: #39cfe1;
      color: #05202a;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main class="card">
    <h1>Čistím toto zařízení</h1>
    <div id="spinner" class="spinner" aria-hidden="true"></div>
    <p id="status">Mažu pouze lokální data LubaNote. Data v cloudu zůstávají beze změny.</p>
    <button id="retry" type="button" hidden>Zkusit znovu</button>
  </main>

  <script>
    (() => {
      "use strict";

      const DB_NAMES = [
        "LubaNoteRegularNotesCache",
        "LubaNoteDraftRecoveryV1",
        "LubaNoteAttachments",
        "LubaNoteMediaCrypto",
        "lubanoteSharedNotesCache"
      ];

      const EXACT_KEYS = [
        "lubanoteAuthOk",
        "lubanoteAuthBlocked",
        "lubanoteLocalOwnerUserId",
        "lubanoteAccessCacheV1",
        "sb-nwdacgigplofksexssws-auth-token",
        "savedTask",
        "savedSecretTask",
        "plannedItems",
        "lubanoteCloudSyncMetaV1",
        "lubanotePendingDeletes",
        "lubanoteRegularNotesStorageModeV1",
        "lubanoteLocalNoteChangeGenerationV1",
        "lubanotePrivateFastSyncStateV1",
        "lubanotePrivateSyncV2CursorV1",
        "lubanotePrivateSafeBootstrapV2V1",
        "lubanoteOhlaseneKonfliktySyncuV1",
        "lubanotePendingEditorReleasesV1",
        "lubanoteSecretSettingsV1",
        "lubanotePendingSecretBackupMetadataV1",
        "lubanoteMediaProtectedIdsV1",
        "lubanoteTagsStartCacheV1",
        "lubanoteSharedRpcForbiddenUntilV1",
        "lubanoteChatFromShareButton",
        "lubanoteDeviceId"
      ];

      const PREFIXES = [
        "lubanoteSharedNotesV1:",
        "lubanoteSharingProfileV1:"
      ];

      const status = document.getElementById("status");
      const spinner = document.getElementById("spinner");
      const retry = document.getElementById("retry");
      const cloudPurged =
        new URLSearchParams(window.location.search)
          .get("cloudPurged") === "1";

      function deleteDb(name) {
        return new Promise((resolve, reject) => {
          if (!window.indexedDB) {
            resolve();
            return;
          }

          let finished = false;
          const timer = setTimeout(() => {
            if (finished) return;
            finished = true;
            reject(new Error(`Databáze ${name} je stále otevřená.`));
          }, 6000);

          const done = (error = null) => {
            if (finished) return;
            finished = true;
            clearTimeout(timer);
            error ? reject(error) : resolve();
          };

          try {
            const request = indexedDB.deleteDatabase(name);
            request.onsuccess = () => done();
            request.onerror = () => done(
              request.error || new Error(`Databázi ${name} se nepodařilo smazat.`)
            );
            request.onblocked = () => done(
              new Error(`Databáze ${name} je otevřená v jiné instanci LubaNote.`)
            );
          } catch (error) {
            done(error);
          }
        });
      }

      function clearLocalStorage() {
        for (const key of EXACT_KEYS) {
          try { localStorage.removeItem(key); } catch (_) {}
        }

        const keys = [];
        try {
          for (let i = 0; i < localStorage.length; i += 1) {
            const key = localStorage.key(i);
            if (key) keys.push(key);
          }
        } catch (_) {}

        for (const key of keys) {
          if (PREFIXES.some((prefix) => key.startsWith(prefix))) {
            try { localStorage.removeItem(key); } catch (_) {}
          }
        }
      }

      async function run() {
        retry.hidden = true;
        spinner.hidden = false;
        status.classList.remove("error");
        status.textContent = cloudPurged
          ? "Cloudová data jsou smazaná. Čistím lokální data tohoto zařízení…"
          : "Mažu pouze lokální data LubaNote. Data v cloudu zůstávají beze změny.";

        try {
          for (const name of DB_NAMES) {
            await deleteDb(name);
          }

          clearLocalStorage();

          try { sessionStorage.clear(); } catch (_) {}

          status.textContent = cloudPurged
            ? "Hotovo. Data LubaNote byla odstraněna, přihlašovací účet zůstal zachovaný. Otevírám LubaNote…"
            : "Hotovo. Otevírám čistou LubaNote…";
          setTimeout(() => {
            window.location.replace("./");
          }, 350);
        } catch (error) {
          console.error("LubaNote local reset failed:", error);
          spinner.hidden = true;
          status.classList.add("error");
          status.textContent =
            "Lokální data se nepodařilo bezpečně vyčistit. Zavři ostatní okna LubaNote a zkus to znovu.";
          retry.hidden = false;
        }
      }

      retry.addEventListener("click", run);
      run();
    })();
  </script>
</body>
</html>
