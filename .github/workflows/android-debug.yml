name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-capacitor

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node20-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Generate build version
        run: |
          echo "window.LUBANOTE_VERSION = '0.9.${GITHUB_RUN_NUMBER}';" > build-version.js
          echo "window.LUBANOTE_BUILD = '${GITHUB_RUN_NUMBER}';" >> build-version.js

      - name: Bundle offline font alternatives (683BQ)
        run: python3 scripts/setup-font-assets-683BQ.py

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html local-reset.html *.css *.js www/
          cp -r icons www/
          cp -r fonts683BQ www/

      - name: Fingerprint bundled JS and CSS
        run: python3 scripts/auto-cache-version.py www

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Protect persistent Android notifications (683AU)
        run: python3 scripts/patch-local-notifications-683AU.py

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Restore keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/notes2go-release.jks

      - name: Build signed APK
        working-directory: android
        run: |
          ./gradlew assembleDebug \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/app/notes2go-release.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LubaNote-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
