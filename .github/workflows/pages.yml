name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Bundle offline font alternatives (683BQ)
        run: python3 scripts/setup-font-assets-683BQ.py

      - name: Prepare web
        run: |
          mkdir -p _site
          cp index.html local-reset.html *.css *.js _site/
          cp -r icons _site/
          cp -r fonts683BQ _site/
          touch _site/.nojekyll

      - name: Generate automatic version
        run: |
          VERSION="${GITHUB_SHA::12}"

          echo "window.LUBANOTE_VERSION = '${VERSION}';" > _site/build-version.js
          echo "window.LUBANOTE_BUILD = '${GITHUB_RUN_NUMBER}';" >> _site/build-version.js

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Fingerprint published JS and CSS
        run: python3 scripts/auto-cache-version.py _site

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4