name: Android PROD APK (clean)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lubanote-android-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Verify PROD staging guard tests
        run: python3 -m unittest discover -s tests -p 'test_prepare_android_production.py' -v

      - name: Generate public version number
        shell: bash
        run: |
          set -euo pipefail
          # Separate from the development workflow's 0.9.x run numbering.
          # 100000+run_number is > the historical Android versionCode=1.
          echo "LUBANOTE_PROD_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "LUBANOTE_PROD_VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          printf "window.LUBANOTE_RELEASE = '1.0';\nwindow.LUBANOTE_BUILD = '%s';\nwindow.LUBANOTE_VERSION = '1.0.%s';\nwindow.LUBANOTE_BUILD_FLAVOR = 'PROD';\n" \
            "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" > build-version.js

      - name: Bundle offline font alternatives (683BQ)
        run: python3 scripts/setup-font-assets-683BQ.py

      - name: Copy web assets to isolated www staging
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p www
          cp index.html local-reset.html *.css *.js www/
          cp -r icons fonts683BQ www/

      - name: Remove development tools from staged web assets
        run: python3 scripts/prepare-android-production.py --stage web --web www

      - name: Fingerprint production JS and CSS
        run: python3 scripts/auto-cache-version.py www

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Protect persistent Android notifications (683AU)
        run: python3 scripts/patch-local-notifications-683AU.py

      - name: Prepare production Android and verify exclusion rules
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare-android-production.py --stage android --android android \
            --version-code "$LUBANOTE_PROD_VERSION_CODE" \
            --version-name "$LUBANOTE_PROD_VERSION_NAME"
          python3 scripts/prepare-android-production.py --stage verify --web www --android android
          node --check www/adminDashboard.js

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo 'ERROR: missing keystore secret'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/notes2go-release.jks

      - name: Build signed, non-debuggable release APK
        working-directory: android
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS"
          ./gradlew --no-daemon assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/app/notes2go-release.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$STORE_PASSWORD"

      - name: Verify signature and non-debuggable manifest
        shell: bash
        run: |
          set -euo pipefail
          apk='android/app/build/outputs/apk/release/app-release.apk'
          test -s "$apk" || { echo 'ERROR: signed release APK not generated'; exit 1; }
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -n 1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt | sort -V | tail -n 1)"
          test -x "$apksigner" && test -x "$aapt"
          "$apksigner" verify --verbose --print-certs "$apk"
          badging="$("$aapt" dump badging "$apk")"
          echo "$badging" | grep '^package:'
          echo "$badging" | grep -F "name='cz.luban.notes2go'" >/dev/null || {
            echo 'ERROR: wrong applicationId in PROD'; exit 1;
          }
          echo "$badging" | grep -F "versionCode='$LUBANOTE_PROD_VERSION_CODE'" >/dev/null || {
            echo 'ERROR: Android versionCode does not match CI'; exit 1;
          }
          if echo "$badging" | grep -q '^application-debuggable'; then
            echo 'ERROR: production APK is debuggable'
            exit 1
          fi
          mkdir -p dist
          cp "$apk" dist/LubaNote-PROD.apk

      - name: Upload clean release APK
        uses: actions/upload-artifact@v4
        with:
          name: LubaNote-PROD
          path: dist/LubaNote-PROD.apk
          if-no-files-found: error
          retention-days: 30
