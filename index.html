<!DOCTYPE html>
<html lang="cs">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LubanNote</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="authPending">
  <div id="loginScreen" hidden>
    <form id="loginForm" class="loginCard" novalidate>
      <div class="loginBrand">
  <img src="icons/lubanote.png" alt="" class="loginLogoImage">
  <strong>LubaNote</strong>
</div>

      <h2>Přihlášení</h2>

      <input
        id="loginEmail"
        type="email"
        placeholder="E-mail"
        autocomplete="email"
        autocapitalize="none"
        spellcheck="false"
        required
      >

      <input
        id="loginPassword"
        type="password"
        placeholder="Heslo"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" type="submit">
        Přihlásit se
      </button>

      <p id="loginMessage" role="alert" aria-live="polite"></p>
    </form>
  </div>

  <header class="homeHeader">
    <div class="homeTitleRow">
      <div class="homeBrand">
  <img src="icons/lubanote.png" alt="" class="homeLogoImage">
  <h1>LubaNote</h1>
</div>

      <div class="homeActions">
        <button id="changeViewButton" aria-label="Změnit zobrazení">▦</button>
        <button id="mainMenuButton" aria-label="Hlavní nabídka">⋮</button>

        <div id="mainMenu" class="mainMenu" hidden>
          <button id="fontSizeSettingsButton">⚙️ Nastavení</button>
        </div>

        <input id="importFile" type="file" accept="application/json" hidden>
      </div>
    </div>

    <div class="searchRow">
      <div class="searchBox">
        <span aria-hidden="true">⌕</span>
        <input id="searchNotes" type="search" placeholder="Hledat poznámky...">
      </div>

      <button id="filterButton" aria-label="Filtrovat poznámky">☷</button>
    </div>

    <nav class="categoryTabs" aria-label="Filtr poznámek">
      <button class="categoryTab active" data-area-filter="all">Vše</button>
      <button class="categoryTab" data-area-filter="work">💼 Pracovní</button>
      <button class="categoryTab" data-area-filter="private">🏠 Soukromé</button>
      <div id="tagFilterButtons"></div>
    </nav>
  </header>

  <main class="app">
    <div id="pinnedCards" class="pinnedCards" hidden>
      <div id="pinnedLeft" class="pinnedColumn"></div>
      <div id="pinnedRight" class="pinnedColumn"></div>
    </div>

    <p id="noSearchResults" hidden>Nenalezeny žádné poznámky.</p>
  </main>

  <div id="taskModal" class="taskModal" hidden>
    <div class="modalContent">
      <div class="editorTopBar">
        <div class="dateTimeInputs">
          <span id="modalWeekday" class="modalWeekday"></span>
          <input type="date" id="modalDate">
          <input type="time" id="modalTime">
        </div>

        <div class="editorTopActions">
          <button id="pinTaskButton" aria-label="Připnout poznámku">&#128204;</button>
          <button id="reminderButton" aria-label="Připomínka">&#128276;</button>
          <button id="moreOptionsButton" aria-label="Další možnosti">&#8942;</button>
        </div>
      </div>

      <input type="text" id="modalTitle" placeholder="Název úkolu">
      <div id="todoList" class="todoList" hidden></div>
      <textarea id="modalText" placeholder="Napiš poznámku..."></textarea>

      <div id="tagMenu" class="tagMenu" hidden>
        <h3>Oblast poznámky</h3>
        <div class="areaOptions">
          <button type="button" data-area="work">💼 Pracovní</button>
          <button type="button" data-area="private">🏠 Soukromé</button>
        </div>

        <h3>Štítky</h3>
        <div class="tagOptions">
          <button type="button" data-tag="code">code</button>
          <button type="button" data-tag="důležité">důležité</button>
          <button type="button" data-tag="projekt">projekt</button>
        </div>
      </div>

      <div class="editorBottomBar">
        <button id="editorBackButton" aria-label="Uložit a zavřít">✔️</button>
        <button id="categoryTaskButton" aria-label="Oblast poznámky">💼</button>
        <button id="priorityTaskButton" aria-label="Priorita">⭐</button>
        <button id="colorTaskButton" aria-label="Barva">🎨</button>
        <button id="tagTaskButton" aria-label="Štítky">🏷️</button>
        <button id="addTodoButton" type="button" aria-label="Přidat položku TODO">☐</button>
        <button id="deleteTaskButton" aria-label="Smazat poznámku">🗑️</button>
      </div>
    </div>
  </div>

  <div id="cardMenu" class="cardMenu" hidden>
    <button type="button" data-card-action="plan">📅 Naplánovat</button>
    <button type="button" data-card-action="pin">📌 Připnout</button>
    <button type="button" data-card-action="complete">✅ Hotovo</button>
    <button type="button" data-card-action="delete">🗑️ Smazat</button>
  </div>

  <div id="deleteConfirmModal" class="deleteConfirmModal" hidden>
    <div class="deleteConfirmBox">
      <h3>Smazat poznámku?</h3>
      <p>Opravdu chceš tuto poznámku smazat?</p>

      <div class="deleteConfirmActions">
        <button id="cancelDeleteButton" type="button">Zrušit</button>
        <button id="confirmDeleteButton" type="button">🗑️ Smazat</button>
      </div>
    </div>
  </div>

  <div id="settingsModal" class="settingsModal" hidden>
    <div class="settingsContent">
      <div class="settingsHeader">
        <h2>Nastavení</h2>
        <button id="closeSettingsButton" type="button" aria-label="Zavřít nastavení">✕</button>
      </div>

      <section class="settingsSection">
        <h3>Vzhled</h3>

        <div class="fontSizeSetting">
          <span>Velikost písma</span>
          <div class="fontSizeControl">
            <button id="decreaseFontButton" type="button" aria-label="Zmenšit písmo">−</button>
            <span id="fontSizeValue">16 px</span>
            <button id="increaseFontButton" type="button" aria-label="Zvětšit písmo">+</button>
          </div>
        </div>

        <div class="themeSetting">
          <span>Barevný motiv</span>
          <div class="themeOptions">
            <button type="button" data-theme="light">Světlý</button>
            <button type="button" data-theme="dark">Tmavý</button>
            <button type="button" data-theme="cappuccino">Cappuccino</button>
          </div>
        </div>
      </section>

      <section class="settingsSection">
        <h3>Data</h3>
        <button id="settingsExportButton" type="button">Export zálohy</button>
        <button id="settingsImportButton" type="button">Import zálohy</button>
      </section>
    </div>
  </div>

  <button id="addTaskButton" class="addTaskButton" aria-label="Přidat poznámku">+</button>

  <script src="reminders.js"></script>
  <script src="storage.js"></script>
  <script src="tags.js"></script>
  <script src="settings.js"></script>
  <script src="todos.js"></script>
  <script src="script.js"></script>
  <script src="cardView.js"></script>
  <script src="search.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="sync.js"></script>
</body>

</html>
